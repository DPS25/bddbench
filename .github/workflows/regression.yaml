name: Regression Test

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Host SUT Benchmarking"]
    types:
      - completed

jobs:
  benchmarking:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    runs-on: dsp25-main-influx
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ["2.1.1", "2.4.0", "2.5.1", "2.7.6"]
        include:
          - version: "2.1.1"
            flake_attr: "benedikt-influx2-1-1"
          - version: "2.4.0"
            flake_attr: "benedikt-influx2-4-0"
          - version: "2.5.1"
            flake_attr: "benedikt-influx2-5-1"
          - version: "2.7.6"
            flake_attr: "benedikt-influx2-7-6"

    steps:
      - name: Checkout bddbench
        uses: actions/checkout@v4
        with:
          path: bddbench

      - name: Checkout nix
        uses: actions/checkout@v4
        with:
          repository: DPS25/nix
          token: ${{ secrets.GH_PAT }}
          path: nix

      - name: Deploy Influx ${{ matrix.version }}
        working-directory: ./nix
        run: |
          ssh dsp25-johann "sudo rm -rf /var/lib/influxdb2/"
          nixos-rebuild switch --flake .#${{ matrix.flake_attr }} \
            --target-host dsp25-johann --build-host "" --sudo

      - name: Run Full Benchmark Suite
        working-directory: ./bddbench
        run: |
          START_TIME=$(date +%s%3N)
          export ENV_NAME=johann_dsp25
          nix develop --command run-full-benchmark-suite
          END_TIME=$(date +%s%3N)
          
          BASE_URL="https://grafana.johann-hackler.com/d/adjcczp/dsp25-bddbench"
          PARAMS="orgId=1&var-bucket=dsp25&var-sut=dsp25-johann&var-scenario_id=\$__all&timezone=browser"
          FINAL_URL="${BASE_URL}?${PARAMS}&from=${START_TIME}&to=${END_TIME}"
          
          echo "## InfluxDB ${{ matrix.version }} Results" >> $GITHUB_STEP_SUMMARY
          echo "**Grafana:** [View Live Dashboard]($FINAL_URL)" >> $GITHUB_STEP_SUMMARY
          
          for plot in reports/plots/*.png; do
            FILE_NAME=$(basename "$plot")
            echo "| $FILE_NAME | Generated | \`plots-${{ matrix.version }}\` |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Plot Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plots-${{ matrix.version }}
          path: bddbench/reports/plots/*.png
          retention-days: 14

  comparison_report:
    needs: benchmarking
    if: always() && needs.benchmarking.result == 'success'
    runs-on: dsp25-main-influx
    steps:
      - name: Checkout bddbench
        uses: actions/checkout@v4

      - name: Generate Cross-Version Comparison
        run: |
          # Define a lookback window to capture all matrix runs
          # Since matrix is max-parallel: 1, 4 hours is usually sufficient
          GLOBAL_START=$(date -u -d "4 hours ago" +"%Y-%m-%dT%H:%M:%SZ")
          GLOBAL_END=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          export ENV_NAME=johann_dsp25
          
          echo "## 📊 Regression Comparison Summary" >> $GITHUB_STEP_SUMMARY
          
          # Run the comparison command from the flake
          nix develop --command run-comparison-report
          
          # Add the comparison plots to the GitHub Summary
          for plot in reports/plots/comparisons/*.png; do
            FILE_NAME=$(basename "$plot")
            echo "### $FILE_NAME" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Status | Artifact |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
            echo "| $FILE_NAME | ✅ Comparison Generated | \`comparison-plots\` |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Comparison Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comparison-plots
          path: reports/plots/comparisons/*.png
          retention-days: 14