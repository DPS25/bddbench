name: Regression Test

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Host SUT Benchmarking"]
    types: [completed]

jobs:
  benchmarking:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: dsp25-main-influx
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ["2.1.1", "2.4.0", "2.5.1", "2.7.6"]
        include:
          - version: "2.1.1"
            flake_attr: "benedikt-influx2-1-1"
          - version: "2.4.0"
            flake_attr: "benedikt-influx2-4-0"
          - version: "2.5.1"
            flake_attr: "benedikt-influx2-5-1"
          - version: "2.7.6"
            flake_attr: "benedikt-influx2-7-6"

    steps:
      - name: Checkout bddbench
        uses: actions/checkout@v4
        with:
          path: bddbench

      - name: Checkout nix
        uses: actions/checkout@v4
        with:
          repository: DPS25/nix
          token: ${{ secrets.GH_PAT }}
          path: nix

      - name: Deploy Influx ${{ matrix.version }}
        working-directory: ./nix
        run: |
          ssh dsp25-johann "sudo rm -rf /var/lib/influxdb2/"
          nixos-rebuild switch --flake .#${{ matrix.flake_attr }} \
            --target-host dsp25-johann --build-host "" --sudo

      - name: Run Full Benchmark Suite
        working-directory: ./bddbench
        run: |
          export ENV_NAME=johann_dsp25
          nix develop --command run-full-benchmark-suite

      # Upload using the name format seen in your artifact list
      - name: Upload Bench Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-data-${{ matrix.version }}
          path: |
            bddbench/reports/plots/*.png
            bddbench/.suite_*
          retention-days: 1

  comparison_report:
    needs: benchmarking
    runs-on: dsp25-main-influx
    steps:
      - name: Checkout bddbench
        uses: actions/checkout@v4

      # IMPORTANT: This downloads ALL bench-data-* artifacts and
      # puts all .suite_ files into the current folder.
      - name: Download and Merge Bench Data
        uses: actions/download-artifact@v4
        with:
          pattern: bench-data-*
          merge-multiple: true

      - name: Generate Cross-Version Comparison
        run: |
          export ENV_NAME=johann_dsp25
          
          # Debug: check if the files actually arrived
          echo "Files in workspace:"
          ls -a
          
          echo "## 📊 Regression Comparison Summary" >> $GITHUB_STEP_SUMMARY
          
          # This command in your flake will now find the merged .suite files
          nix develop --command run-comparison-report
          
          # Add plots to summary
          if [ -d reports/plots/comparisons ]; then
            for plot in reports/plots/comparisons/*.png; do
              echo "### $(basename "$plot")" >> $GITHUB_STEP_SUMMARY
              echo "![Comparison]($plot)" >> $GITHUB_STEP_SUMMARY
            done
          fi

      - name: Upload Comparison Result
        uses: actions/upload-artifact@v4
        with:
          name: comparison-plots
          path: reports/plots/comparisons/*.png