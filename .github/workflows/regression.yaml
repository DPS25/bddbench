name: Regression Test

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Host SUT Benchmarking"]
    types: [completed]

jobs:
  benchmarking:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: dsp25-main-influx

    steps:
      - name: Checkout bddbench (Benchmark Code)
        uses: actions/checkout@v4
        with:
          path: bddbench

      - name: Checkout nix (Secrets & Deployment Flake)
        uses: actions/checkout@v4
        with:
          repository: DPS25/nix
          token: ${{ secrets.GH_PAT }}
          path: nix-secrets

      - name: Execute Full Matrix via Flake
        working-directory: ./bddbench
        run: |
          export ENV_NAME=benedikt_dsp25 && nix develop --command "run-all-matrix-versions"

      - name: Generate Summary and Grafana Link
        working-directory: ./bddbench
        run: |
          # Extract timing from the files created by the flake scripts
          START_TIME=$(sort .suite_start_times | head -n 1)
          END_TIME=$(sort .suite_end_times | tail -n 1)
          
          # Convert ISO8601 to Unix MS for Grafana if needed, 
          # but Grafana supports ISO8601 strings in URLs too.
          BASE_URL="https://grafana.johann-hackler.com/d/adjcczp/dsp25-bddbench"
          PARAMS="orgId=1&var-bucket=dsp25&var-sut=dsp25-benedikt&var-scenario_id=cpu&var-scenario_id=memory&var-scenario_id=storage&timezone=browser"
          FINAL_URL="${BASE_URL}?${PARAMS}&from=${START_TIME}&to=${END_TIME}"

          echo "## 📊 Regression Result Summary" >> $GITHUB_STEP_SUMMARY
          echo "Test Period: \`$START_TIME\` to \`$START_TIME\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛠️ Host SUT Performance Baseline" >> $GITHUB_STEP_SUMMARY
          echo "**Grafana Dashboard:** [View Host Metrics]($FINAL_URL)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-plots
          path: |
            bddbench/reports/plots/versions/
            bddbench/reports/plots/comparisons/